<script>
(function() {
  var AIRTABLE_TOKEN = "patO4oUqCcfTLFuRm.c66b68adb436d3d2b7038ebda60664f9a5b964ce4d778f6fceebf0e886e85482";
  var AIRTABLE_BASE  = "appmY7jVeBehY5Mz7";
  var AIRTABLE_TABLE = "CARTERA INMUEBLES";

  var FIELD_MAP = {
    "DIRECCIÓN":          "input_135",
    "EMAIL HASTA CHECK IN":"input_360"
  };

  var lastRef = "";
  var timeout = null;
  var referenciaValida = false;

  window.addEventListener("load", function() {
    var refInput = document.getElementById("input_416");
    var submitBtn = document.getElementById("input_81");

    if (!refInput) return;

    bloquearSubmit(submitBtn, true);

    refInput.addEventListener("input", function() {
      var pos = refInput.selectionStart;
      refInput.value = refInput.value.toUpperCase();
      refInput.setSelectionRange(pos, pos);

      clearTimeout(timeout);
      referenciaValida = false;
      bloquearSubmit(submitBtn, true);
      quitarMensaje();

      var ref = refInput.value.trim();
      if (ref.length < 2) return;

      timeout = setTimeout(function() {
        if (ref !== lastRef) {
          lastRef = ref;
          buscarReferencia(ref, submitBtn);
        }
      }, 800);
    });

    var form = document.querySelector("form.jotform-form");
    if (form) {
      form.addEventListener("submit", function(e) {
        if (!referenciaValida) {
          e.preventDefault();
          e.stopPropagation();
          mostrarMensaje("❌ Introduce una referencia válida antes de continuar.", "error");
          return false;
        }
      }, true);
    }
  });

  function bloquearSubmit(btn, bloquear) {
    if (!btn) return;
    if (bloquear) {
      btn.style.opacity = "0.4";
      btn.style.cursor = "not-allowed";
      btn.setAttribute("disabled", "disabled");
    } else {
      btn.style.opacity = "1";
      btn.style.cursor = "pointer";
      btn.removeAttribute("disabled");
    }
  }

  function mostrarMensaje(texto, tipo) {
    quitarMensaje();
    var msg = document.createElement("div");
    msg.id = "ref-status-msg";
    msg.style.cssText = "margin-top:6px; font-size:13px; font-weight:bold; padding:6px 10px; border-radius:4px;";
    if (tipo === "error") { msg.style.color = "#cc0000"; msg.style.background = "#fff0f0"; }
    else if (tipo === "ok") { msg.style.color = "#007700"; msg.style.background = "#f0fff0"; }
    else { msg.style.color = "#666"; msg.style.background = "#f5f5f5"; }
    msg.textContent = texto;
    var refInput = document.getElementById("input_416");
    if (refInput && refInput.parentNode) {
      refInput.parentNode.insertBefore(msg, refInput.nextSibling);
    }
  }

  function quitarMensaje() {
    var msg = document.getElementById("ref-status-msg");
    if (msg) msg.remove();
  }

  function buscarReferencia(referencia, submitBtn) {
    mostrarMensaje("🔍 Buscando referencia...", "info");
    var url = "https://api.airtable.com/v0/"
            + AIRTABLE_BASE + "/"
            + encodeURIComponent(AIRTABLE_TABLE)
            + "?filterByFormula=" + encodeURIComponent("REFERENCIA='" + referencia + "'")
            + "&maxRecords=1";
    fetch(url, { headers: { "Authorization": "Bearer " + AIRTABLE_TOKEN } })
    .then(function(res) { return res.json(); })
    .then(function(data) {
      if (data.records && data.records.length > 0) {
        referenciaValida = true;
        bloquearSubmit(submitBtn, false);
        mostrarMensaje("✅ Referencia encontrada", "ok");
        rellenarCampos(data.records[0].fields);
      } else {
        referenciaValida = false;
        bloquearSubmit(submitBtn, true);
        mostrarMensaje("❌ Referencia no encontrada. Escríbela en MAYÚSCULAS.", "error");
      }
    })
    .catch(function() {
      referenciaValida = false;
      bloquearSubmit(submitBtn, true);
      mostrarMensaje("⚠️ Error de conexión. Inténtalo de nuevo.", "error");
    });
  }

  function rellenarCampos(fields) {
    for (var columna in FIELD_MAP) {
      var inputId = FIELD_MAP[columna];
      var valor = fields[columna] || "";
      var el = document.getElementById(inputId);
      if (el) {
        el.value = valor;
        el.dispatchEvent(new Event("input",  { bubbles: true }));
        el.dispatchEvent(new Event("change", { bubbles: true }));
      }
    }
  }
})();
</script>
