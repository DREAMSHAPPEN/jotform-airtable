<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  body { margin: 0; padding: 4px; font-family: Arial, sans-serif; font-size: 12px; }
  #status { color: #888; }
  #status.ok { color: green; font-weight: bold; }
  #status.error { color: red; }
</style>
</head>
<body>
<div id="status">Introduce tu referencia arriba</div>
<script>
const AIRTABLE_TOKEN = "patmthwargrCh31dd.f691dba4de6175ef37fe9a7e197085f6d05cb2071550540dffdf33cfd67302cd";
const AIRTABLE_BASE  = "appmY7jVeBehY5Mz7";
const AIRTABLE_TABLE = "CARTERA INMUEBLES";
const FIELD_MAP = {
  "DIRECCIÓN":                "q135_direccion",
  "Fecha prevista de salida": "q377_fechaPrevista"
};

var lastRef = "";

setInterval(function() {
  try {
    var refInput = window.parent.document.querySelector('[name="q378_referencia"]');
    if (!refInput) return;
    var ref = refInput.value.trim().toUpperCase();
    if (ref.length < 2 || ref === lastRef) return;
    lastRef = ref;
    buscarReferencia(ref);
  } catch(e) {}
}, 800);

window.addEventListener("message", function(event) {
  if (typeof event.data === "string" && event.data.length >= 2) {
    buscarReferencia(event.data.toUpperCase());
  }
});

function buscarReferencia(referencia) {
  document.getElementById("status").textContent = "Buscando " + referencia + "...";
  document.getElementById("status").className = "";
  var url = "https://api.airtable.com/v0/"
          + AIRTABLE_BASE + "/"
          + encodeURIComponent(AIRTABLE_TABLE)
          + "?filterByFormula=" + encodeURIComponent("REFERENCIA='" + referencia + "'")
          + "&maxRecords=1";
  fetch(url, {
    headers: { "Authorization": "Bearer " + AIRTABLE_TOKEN }
  })
  .then(function(res) { return res.json(); })
  .then(function(data) {
    if (data.records && data.records.length > 0) {
      rellenarCampos(data.records[0].fields);
      document.getElementById("status").textContent = "✅ Referencia encontrada";
      document.getElementById("status").className = "ok";
    } else {
      document.getElementById("status").textContent = "❌ Referencia no encontrada";
      document.getElementById("status").className = "error";
    }
  })
  .catch(function(err) {
    document.getElementById("status").textContent = "Error de conexión";
    document.getElementById("status").className = "error";
  });
}

function rellenarCampos(fields) {
  for (var columna in FIELD_MAP) {
    var fieldName = FIELD_MAP[columna];
    var valor = fields[columna] || "";
    try {
      var el = window.parent.document.querySelector('[name="' + fieldName + '"]');
      if (el) {
        el.value = valor;
        el.dispatchEvent(new Event("input",  { bubbles: true }));
        el.dispatchEvent(new Event("change", { bubbles: true }));
      }
    } catch(e) {
      window.parent.postMessage(JSON.stringify({
        action: "fillField",
        name: fieldName,
        value: valor
      }), "*");
    }
  }
}
</script>
</body>
</html>
